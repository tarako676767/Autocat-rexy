<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>autocat.jp - システムログ</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101017;
      --card: #191923;
      --border: #303041;
      --accent: #79cfff;
      --text: #f5f5fa;
      --muted: #a5a5b5;
      --error: #ff7185;
      --ok: #65d69a;
      --warn: #ffd166;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
    }
    main {
      width: min(920px, calc(100% - 28px));
      margin: 38px auto;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
    }
    h1 { margin: 0; font-size: 24px; }
    p { color: var(--muted); line-height: 1.7; margin: 0 0 12px; }
    .head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .spacer { flex: 1; }
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .link {
      display: inline-flex;
      align-items: center;
      padding: 9px 13px;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      text-decoration: none;
      font-size: 12px;
      font-weight: 800;
      background: transparent;
      cursor: pointer;
    }
    .link:hover { border-color: var(--accent); }
    .btn-action {
      border: 0;
      border-radius: 9px;
      padding: 9px 13px;
      background: var(--accent);
      color: #071018;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-action:hover { opacity: 0.9; }
    
    /* トグルスイッチ */
    .switch-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    .switch-label input { cursor: pointer; }

    /* ログコンソールエリア */
    .console-box {
      background: #101018;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      height: 60vh;
      min-height: 400px;
      overflow-y: auto;
      font-family: ui-monospace, monospace;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .log-line {
      padding: 2px 0;
      border-bottom: 1px solid rgba(48, 48, 65, 0.4);
    }
    .log-line:last-child { border-bottom: 0; }
    .log-info { color: var(--text); }
    .log-ok { color: var(--ok); }
    .log-warn { color: var(--warn); }
    .log-error { color: var(--error); }

    @media(max-width: 520px) {
      main { margin: 18px auto; }
      .card { padding: 18px; }
      .head { align-items: flex-start; flex-wrap: wrap; }
      .controls { width: 100%; justify-content: flex-start; }
    }
  </style>
</head>
<body>
<main>
  <section class="card">
    <div class="head">
      <h1>リアルタイムシステムログ</h1>
      <div class="spacer"></div>
      <a class="link"href="/">管理パネルへ戻る</a>
    </div>

    <div class="controls" style="margin-bottom: 16px;">
      <label class="switch-label">
        <input type="checkbox" id="autoScroll" checked> 自動スクロール
      </label>
      <div class="spacer"></div>
      <button class="link" onclick="fetchLogs()">🔄 手動更新</button>
      <button class="link" onclick="clearConsole()">🧹 クリア</button>
    </div>

    <div id="console" class="console-box">
      <div class="log-line log-info">[SYSTEM] ログコンソールを初期化しました。データの取得を開始します...</div>
    </div>
  </section>
</main>

<script>
const consoleEl = document.getElementById('console');
const autoScrollEl = document.getElementById('autoScroll');

async function fetchLogs() {
  try {
    const res = await fetch('/api/admin/logs', { cache: 'no-store' });
    if (!res.ok) throw new Error('ログの取得に失敗しました');
    const data = await res.json();
    
    const logs = Array.isArray(data) ? data : (data.logs || []);
    
    if (logs.length > 0) {
      consoleEl.innerHTML = '';
      logs.forEach(log => appendLog(log));
    }
  } catch (err) {
    appendLog(`[ERROR] 通信エラー: ${err.message}`, 'error');
  }
}

function appendLog(text, levelOverride = null) {
  const line = document.createElement('div');
  line.className = 'log-line';

  if (levelOverride === 'error' || text.includes('ERROR') || text.includes('全失敗') || text.includes('Failed')) {
    line.classList.add('log-error');
  } else if (text.includes('WARN') || text.includes('WARNING') || text.includes('注意')) {
    line.classList.add('log-warn');
  } else if (text.includes('SUCCESS') || text.includes('成功') || text.includes('完了') || text.includes('OK')) {
    line.classList.add('log-ok');
  } else {
    line.classList.add('log-info');
  }

  line.textContent = text;
  consoleEl.appendChild(line);

  if (autoScrollEl.checked) {
    consoleEl.scrollTop = consoleEl.scrollHeight;
  }
}

function clearConsole() {
  consoleEl.innerHTML = '<div class="log-line log-info">[SYSTEM] 画面表示をクリアしました。</div>';
}

// 初回読み込みと3秒ごとの自動更新
fetchLogs();
setInterval(fetchLogs, 3000);
</script>
</body>
</html>
